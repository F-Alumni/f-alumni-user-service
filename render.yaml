services:
  - type: web
    name: f-alumni-user-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: DatabaseProvider
        value: InMemory
      - key: Database__SeedOnStartup
        value: "true"
      - key: Auth__AutoActivateOnRegister
        value: "false"
      - key: Smtp__Host
        value: "smtp.gmail.com"
      - key: Smtp__Port
        value: "587"
      - key: Smtp__EnableSsl
        value: "true"
      - key: Smtp__FromName
        value: "FPT Alumni Connect"
      - key: Jwt__Issuer
        value: https://identity.falumni.local
      - key: Jwt__Audience
        value: falumni-services
      - key: Jwt__Key
        value: "falumni-production-shared-jwt-secret-key-2026-min-32-bytes"
